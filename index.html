  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
    
    h2 { text-align: center; color: #1a365d; margin-bottom: 5px; font-size: 20px; }
    p.sub { text-align: center; color: #4a5568; font-size: 13px; margin-top: 0; margin-bottom: 15px; }
    
    /* Box de Identificação do Aluno */
    .setup-box { background: #ffffff; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border-left: 5px solid #2b6cb0; }
    .setup-box label { font-size: 13px; color: #2d3748; font-weight: bold; display: block; margin-top: 8px; }
    .setup-box input { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 6px; margin-top: 4px; outline: none; }
    .setup-box input:focus { border-color: #2b6cb0; }

    /* Cards de Questões */
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .question { font-weight: bold; color: #1a202c; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    .question-subject { display: inline-block; background: #e2e8f0; color: #2d3748; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; font-weight: bold; }
    
    /* Opções Clicáveis */
    .option-row { 
      display: flex; 
      align-items: center; 
      margin-bottom: 8px; 
      padding: 10px 12px; 
      border-radius: 8px; 
      background: #f8fafc; 
      border: 2px solid #e2e8f0; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }
    .option-row:hover { background: #edf2f7; border-color: #cbd5e0; }
    
    /* Estado Selecionado */
    .option-row.selected {
      background: #ebf8ff;
      border-color: #3182ce;
      box-shadow: 0 0 0 1px #3182ce;
    }

    .option-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #a0aec0;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .option-row.selected .option-radio {
      border-color: #3182ce;
      background-color: #3182ce;
    }
    .option-row.selected .option-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
    }

    .option-text { font-size: 13px; color: #2d3748; flex: 1; line-height: 1.3; }

    /* Botão Final */
    .finish-btn { background: #2b6cb0; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(43, 108, 176, 0.3); }
    .finish-btn:disabled { background: #a0aec0; }
    
    .reset-test-btn { background: #e2e8f0; color: #4a5568; border: none; padding: 8px; width: 100%; border-radius: 6px; font-size: 11px; margin-top: 10px; cursor: pointer; }

    /* Tela de Bloqueio */
    #bloqueio { text-align: center; padding: 40px 20px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 8px; margin-top: 30px; }
  </style>
</head>
