<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Avaliação de Engenharia Econômica - Prof. Marcilon Fonseca</title>
  
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
    
    h2 { text-align: center; color: #1a365d; margin-bottom: 5px; font-size: 20px; }
    p.sub { text-align: center; color: #4a5568; font-size: 13px; margin-top: 0; margin-bottom: 15px; }
    
    /* Box de Identificação do Aluno */
    .setup-box { background: #ffffff; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); border-left: 5px solid #2b6cb0; }
    .setup-box label { font-size: 13px; color: #2d3748; font-weight: bold; display: block; margin-top: 8px; }
    .setup-box input { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 6px; margin-top: 4px; outline: none; }
    .setup-box input:focus { border-color: #2b6cb0; }

    /* Cards de Questões */
    .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .question { font-weight: bold; color: #1a202c; margin-bottom: 12px; font-size: 14px; line-height: 1.4; }
    .question-subject { display: inline-block; background: #e2e8f0; color: #2d3748; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; font-weight: bold; }
    
    /* Opções Clicáveis */
    .option-row { 
      display: flex; 
      align-items: center; 
      margin-bottom: 8px; 
      padding: 10px 12px; 
      border-radius: 8px; 
      background: #f8fafc; 
      border: 2px solid #e2e8f0; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }
    .option-row:hover { background: #edf2f7; border-color: #cbd5e0; }
    
    /* Estado Selecionado */
    .option-row.selected {
      background: #ebf8ff;
      border-color: #3182ce;
      box-shadow: 0 0 0 1px #3182ce;
    }

    .option-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #a0aec0;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .option-row.selected .option-radio {
      border-color: #3182ce;
      background-color: #3182ce;
    }
    .option-row.selected .option-radio::after {
      content: '';
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
    }

    .option-text { font-size: 13px; color: #2d3748; flex: 1; line-height: 1.3; }

    /* Botão Final */
    .finish-btn { background: #2b6cb0; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(43, 108, 176, 0.3); }
    .finish-btn:disabled { background: #a0aec0; }
    
    .reset-test-btn { background: #e2e8f0; color: #4a5568; border: none; padding: 8px; width: 100%; border-radius: 6px; font-size: 11px; margin-top: 10px; cursor: pointer; }

    /* Tela de Bloqueio */
    #bloqueio { text-align: center; padding: 40px 20px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 8px; margin-top: 30px; }
  </style>
</head>
<body>

  <div id="main-content">
    <h2>Avaliação de Engenharia Econômica</h2>
    <p class="sub">Prof. Marcilon Fonseca de Lima — PUC Goiás (Eng. Elétrica / Eng. Controle e Automação)</p>

    <div class="setup-box">
      <label for="studentName">Nome Completo do Aluno:</label>
      <input type="text" id="studentName" placeholder="Digite seu nome completo" oninput="salvarDadosSessao()">
      
      <label for="studentId">Matrícula / RA:</label>
      <input type="text" id="studentId" placeholder="Digite sua matrícula" oninput="salvarDadosSessao()">
      
      <button class="reset-test-btn" onclick="resetarTesteDebug()">🔄 Limpar trava de teste (Modo Professor/Desenvolvedor)</button>
    </div>

    <div id="quiz-container"></div>

    <button class="finish-btn" onclick="submitResults()">Enviar Respostas</button>
  </div>

  <script>
    // URL do fluxo do Power Automate
    const powerAutomateUrl = "https://default73319f4289084b899f8d558cf4d5d7.76.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/a53fe912718f49a2b715266afaa8ac90/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=vh3gwHCs1Mjo40V3bu44lOr2sRQedsGjyHfmImpm7Xs";

    // Banco de Questões - Engenharia Econômica
    const questions = [
      {
        id: 1,
        subject: "Juros Simples e Compostos",
        title: "1) Um investidor aplicou R\$ 10.000,00 por um período de 6 meses. Na primeira opção, sob juros simples de 2% a.m., e na segunda opção, sob juros compostos de 2% a.m. Qual é a diferença entre os montantes finais obtidos ao fim do período?",
        options: [
          { letter: "A", text: "R\$ 61,62" },
          { letter: "B", text: "R\$ 126,16" },
          { letter: "C", text: "R\$ 261,62" },
          { letter: "D", text: "R\$ 0,00" }
        ]
      },
      {
        id: 2,
        subject: "Taxas Nominais e Equivalentes",
        title: "2) Uma instituição financeira divulga uma taxa nominal de 24% ao ano com capitalização mensal. Qual é a taxa efetiva anual equivalente a essa aplicação?",
        options: [
          { letter: "A", text: "24,00% a.a." },
          { letter: "B", text: "26,82% a.a." },
          { letter: "C", text: "25,44% a.a." },
          { letter: "D", text: "28,24% a.a." }
        ]
      },
      {
        id: 3,
        subject: "Sistemas de Amortização (SAC vs SAF)",
        title: "3) Um financiamento de R\$ 100.000,00 será quitado em 4 parcelas mensais à taxa de 2% a.m. Compare a primeira prestação no SAC com a prestação fixa do SAF (Price):",
        options: [
          { letter: "A", text: "A primeira prestação no SAC (R\$ 25.000,00) é menor que no SAF (R\$ 26.262,38)." },
          { letter: "B", text: "Ambas as prestações iniciais são perfeitamente iguais a R\$ 26.000,00." },
          { letter: "C", text: "A primeira prestação no SAC (R\$ 27.000,00) é maior que a prestação fixa do SAF (R\$ 26.262,38)." },
          { letter: "D", text: "A primeira prestação no SAC é de R\$ 25.000,00 e no SAF é de R\$ 27.000,00." }
        ]
      },
      {
        id: 4,
        subject: "Sistema de Amortização Crescente (SACRE)",
        title: "4) No Sistema de Amortização Crescente (SACRE), como se comportam as prestações e a velocidade de amortização em comparação ao SAF tradicional?",
        options: [
          { letter: "A", text: "As prestações são rigorosamente constantes do início ao fim e amortizam menos." },
          { letter: "B", text: "As prestações tendem a ser decrescentes após reajustes, amortizando o saldo mais rapidamente que o SAF." },
          { letter: "C", text: "O saldo devedor cresce exponencialmente até a metade do contrato." },
          { letter: "D", text: "O SACRE não calcula juros sobre o saldo devedor remanescente." }
        ]
      },
      {
        id: 5,
        subject: "Análise de Viabilidade (VPL)",
        title: "5) Um projeto exige R\$ 50.000,00 de investimento inicial e gera fluxos líquidos de R\$ 30.000,00 (Ano 1) e R\$ 35.000,00 (Ano 2). Sob TMA de 10% a.a., o VPL é aproximadamente:",
        options: [
          { letter: "A", text: "R\$ 6.198,35 (Projeto Viável)" },
          { letter: "B", text: "R\$ 5.000,00 (Projeto Inviável)" },
          { letter: "C", text: "R\$ 15.000,00 (Projeto Viável)" },
          { letter: "D", text: "-R\$ 3.245,10 (Projeto Inviável)" }
        ]
      },
      {
        id: 6,
        subject: "Payback Simples vs Descontado",
        title: "6) Considere um investimento inicial de R\$ 100.000,00 com retornos uniformes de R\$ 40.000,00 por 3 anos (TMA = 10% a.a.). Qual a relação correta entre os paybacks?",
        options: [
          { letter: "A", text: "Payback Simples = 2,5 anos; Payback Descontado = 2,5 anos." },
          { letter: "B", text: "Payback Simples = 3,0 anos; Payback Descontado = 2,0 anos." },
          { letter: "C", text: "Payback Simples = 2,0 anos; Payback Descontado = 2,5 anos." },
          { letter: "D", text: "Payback Simples = 2,5 anos; Payback Descontado > 2,5 anos." }
        ]
      },
      {
        id: 7,
        subject: "Índice de Lucratividade (ILL)",
        title: "7) Um projeto apresenta Valor Presente das Entradas de R\$ 180.000,00 para um Investimento Inicial de R\$ 150.000,00. Qual o valor do ILL e sua interpretação?",
        options: [
          { letter: "A", text: "ILL = 0,83; O projeto destrói valor e deve ser rejeitado." },
          { letter: "B", text: "ILL = 1,20; Para cada R\$ 1,00 investido, retorna R\$ 1,20 em valor presente." },
          { letter: "C", text: "ILL = 0,20; O retorno é de apenas 20% do capital sem TMA." },
          { letter: "D", text: "ILL = 1,50; O projeto dobra o capital investido em 2 anos." }
        ]
      },
      {
        id: 8,
        subject: "Taxa Interna de Retorno Modificada (TIRM)",
        title: "8) Um projeto exige R\$ 100.000,00 no ano 0 e gera fluxos de caixa de R\$ 50.000,00 no Ano 1 e R\$ 70.000,00 no Ano 2. Considerando uma taxa de reinvestimento de 10% a.a. (TMA), a Taxa Interna de Retorno Modificada (TIRM) é aproximadamente:",
        options: [
          { letter: "A", text: "11,80% a.a." },
          { letter: "B", text: "20,00% a.a." },
          { letter: "C", text: "10,00% a.a." },
          { letter: "D", text: "15,45% a.a." }
        ]
      },
      {
        id: 9,
        subject: "Estrutura do Sistema Financeiro Nacional (SFN)",
        title: "9) No Sistema Financeiro Nacional (SFN), o órgão colegiado responsável por fixar a meta da taxa Selic e o órgão fiscalizador do mercado de valores mobiliários (ações e fundos) são, respectivamente:",
        options: [
          { letter: "A", text: "CMN (Conselho Monetário Nacional) e BACEN (Banco Central do Brasil)." },
          { letter: "B", text: "SUSEP e BNDES." },
          { letter: "C", text: "COPOM (Comitê de Política Monetária) e CVM (Comissão de Valores Mobiliários)." },
          { letter: "D", text: "Tesouro Nacional e Banco do Brasil." }
        ]
      },
      {
        id: 10,
        subject: "Gestão de Risco",
        title: "10) Na gestão de riscos de projetos de engenharia, a avaliação do nível de criticidade no mapa de risco baseia-se na combinação de:",
        options: [
          { letter: "A", text: "Custo fixo do projeto e taxa de depreciação dos equipamentos." },
          { letter: "B", text: "Taxa interna de retorno e payback simples do empreendimento." },
          { letter: "C", text: "Flutuação do câmbio e índice inflacionário acumulado." },
          { letter: "D", text: "Probabilidade de ocorrência do evento e Impacto/Severidade nos objetivos." }
        ]
      }
    ];

    let selectedAnswers = JSON.parse(sessionStorage.getItem("respostas_temp") || "{}"); 
    let isSubmitted = false;
    let tabSwitchCount = parseInt(sessionStorage.getItem("trocas_tela_temp") || "0");

    function salvarDadosSessao() {
      const name = document.getElementById('studentName').value;
      const id = document.getElementById('studentId').value;
      sessionStorage.setItem("nome_temp", name);
      sessionStorage.setItem("matricula_temp", id);
      sessionStorage.setItem("respostas_temp", JSON.stringify(selectedAnswers));
      sessionStorage.setItem("trocas_tela_temp", tabSwitchCount.toString());
    }

    function resetarTesteDebug() {
      localStorage.removeItem("prova_eng_econ_iniciada");
      localStorage.removeItem("prova_eng_econ_enviada");
      sessionStorage.clear();
      location.reload();
    }

    // Alerta preventivo ao tentar fechar/atualizar
    window.addEventListener("beforeunload", function (e) {
      if (!isSubmitted && localStorage.getItem("prova_eng_econ_enviada") !== "true" && localStorage.getItem("prova_eng_econ_iniciada") === "true") {
        e.preventDefault();
        e.returnValue = "Se você recarregar ou sair, sua prova será encerrada e enviada como está!";
        return e.returnValue;
      }
    });

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      if (!container) return;
      container.innerHTML = '';
      
      if(sessionStorage.getItem("nome_temp")) document.getElementById('studentName').value = sessionStorage.getItem("nome_temp");
      if(sessionStorage.getItem("matricula_temp")) document.getElementById('studentId').value = sessionStorage.getItem("matricula_temp");

      questions.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `question-card-${q.id}`;
        
        let html = `
          <span class="question-subject">${q.subject}</span>
          <div class="question">${q.title}</div>
        `;
        
        q.options.forEach((opt) => {
          const isSelected = selectedAnswers[q.id] === opt.letter ? 'selected' : '';
          html += `
            <div class="option-row ${isSelected}" id="opt-${q.id}-${opt.letter}" onclick="selectOption(${q.id}, '${opt.letter}')">
              <div class="option-radio"></div>
              <div class="option-text"><b>${opt.letter})</b> ${opt.text}</div>
            </div>
          `;
        });
        
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function selectOption(qId, letter) {
      if (isSubmitted) return;

      const name = document.getElementById('studentName').value.trim();
      const id = document.getElementById('studentId').value.trim();

      if (!name || !id) {
        alert("⚠️ Preencha seu Nome e Matrícula/RA antes de selecionar as respostas!");
        if(!name) document.getElementById('studentName').focus();
        else document.getElementById('studentId').focus();
        return;
      }

      // Ativa a flag de início da prova no momento em que o aluno marca a primeira resposta
      localStorage.setItem("prova_eng_econ_iniciada", "true");

      selectedAnswers[qId] = letter;
      salvarDadosSessao();

      const q = questions.find(item => item.id === qId);
      q.options.forEach((opt) => {
        const row = document.getElementById(`opt-${qId}-${opt.letter}`);
        if (row) {
          if (opt.letter === letter) {
            row.classList.add('selected');
          } else {
            row.classList.remove('selected');
          }
        }
      });
    }

    function submitResults(isForced = false, motivoForcado = "") {
      if (isSubmitted) return;

      let name = document.getElementById('studentName')?.value.trim() || sessionStorage.getItem("nome_temp") || "ALUNO NÃO IDENTIFICADO";
      let studentId = document.getElementById('studentId')?.value.trim() || sessionStorage.getItem("matricula_temp") || "N/A";

      if ((!name || !studentId) && !isForced) {
        alert("Por favor, preencha seu nome e sua matrícula antes de enviar.");
        return;
      }

      if (Object.keys(selectedAnswers).length < questions.length && !isForced) {
        if(!confirm("Você ainda não respondeu todas as questões. Deseja enviar assim mesmo?")) {
          return;
        }
      }

      if (isForced && motivoForcado) {
        name = `${name} [ENCERRADA: ${motivoForcado}]`;
      }

      const btn = document.querySelector('.finish-btn');
      if (btn) {
        btn.innerText = "Enviando...";
        btn.disabled = true;
      }

      isSubmitted = true;
      localStorage.setItem("prova_eng_econ_enviada", "true");

      const payload = {
        Data: new Date().toISOString().split('T')[0],
        Aluno: name,
        Matricula: studentId,
        Respostas: JSON.stringify(selectedAnswers),
        TrocasDeTela: tabSwitchCount
      };

      fetch(powerAutomateUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(response => {
        exibirTelaEncerramento(name, isForced, motivoForcado);
      })
      .catch(error => {
        console.error(error);
        exibirTelaEncerramento(name, isForced, motivoForcado);
      });
    }

    function exibirTelaEncerramento(nome, foiForcado, motivo) {
      let mensagemHtml = "";
      if (foiForcado) {
        mensagemHtml = `
          <div style="text-align:center; color:#721c24; background:#f8d7da; padding:30px; border-radius:8px; margin-top: 30px; border: 1px solid #f5c6cb;">
            <h2>🚫 Prova Encerrada e Enviada!</h2>
            <p>A prova de <strong>${nome}</strong> foi encerrada automaticamente devido a: <strong>${motivo}</strong>.</p>
            <p>Suas respostas registradas até o momento do encerramento foram salvas na planilha do professor.</p>
          </div>
        `;
      } else {
        mensagemHtml = `
          <div style="text-align:center; color:#155724; background:#d4edda; padding:30px; border-radius:8px; margin-top: 30px;">
            <h2>✅ Avaliação Concluída e Enviada!</h2>
            <p>Obrigado, <strong>${nome}</strong>. Suas respostas foram registradas com sucesso na planilha do professor.</p>
          </div>
        `;
      }
      document.getElementById("main-content").innerHTML = mensagemHtml;
    }

    // Detecção de recarregamento após início
    function verificarRecarregamentoInvalido() {
      if (localStorage.getItem("prova_eng_econ_enviada") === "true") {
        exibirTelaEncerramento("ALUNO", true, "Tentativa de reabrir prova já enviada");
        return true;
      }

      const perfEntries = performance.getEntriesByType("navigation");
      const foiReload = perfEntries.length > 0 && perfEntries[0].type === "reload";

      if (foiReload && localStorage.getItem("prova_eng_econ_iniciada") === "true") {
        submitResults(true, "Recarregamento de página detectado (F5/Reload)");
        return true;
      }
      return false;
    }

    // Monitoramento Anti-Colação (Troca de Abas)
    document.addEventListener("visibilitychange", function() {
      if (document.hidden && !isSubmitted && localStorage.getItem("prova_eng_econ_enviada") !== "true" && localStorage.getItem("prova_eng_econ_iniciada") === "true") {
        tabSwitchCount++;
        salvarDadosSessao();

        if (tabSwitchCount === 1) {
          alert("⚠️ ATENÇÃO: Você saiu da tela do teste!\n\nO professor foi notificado. (1ª infração).");
        } else if (tabSwitchCount === 2) {
          alert("⚠️ AVISO CRÍTICO: Segunda saída detectada!\n\nSe sair mais uma vez, a prova será ENCERRADA.");
        } else if (tabSwitchCount >= 3) {
          alert("🚫 PROVA BLOQUEADA E ENCERRADA!\n\nVocê excedeu o limite de saídas da tela.");
          document.body.style.pointerEvents = "none";
          document.body.style.opacity = "0.4";
          submitResults(true, "Excesso de trocas de tela (3x)");
        }
      }
    });

    window.onload = function() {
      if (!verificarRecarregamentoInvalido()) {
        renderQuiz();
      }
    };
  </script>
</body>
</html>
